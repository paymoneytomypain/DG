<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>WebView2 GPU検証</title>

<style>

body{
    font-family:Meiryo;
    background:#f3f3f3;
    margin:20px;
}

h1{
    background:#0066cc;
    color:white;
    padding:10px;
}

section{

    background:white;
    margin-bottom:20px;
    padding:15px;
    border-radius:8px;
    box-shadow:0 0 4px gray;

}

table{
    border-collapse:collapse;
    width:100%;
}

td{
    border:1px solid silver;
    padding:6px;
}

canvas{

    border:1px solid gray;
}

#cssArea{

    width:800px;
    height:250px;
    overflow:hidden;
    position:relative;
    background:black;
}

.ball{

    width:12px;
    height:12px;
    border-radius:6px;
    background:red;
    position:absolute;

    animation:move 4s linear infinite;
}

@keyframes move{

0%{transform:translate(0px,0px);}
50%{transform:translate(760px,220px);}
100%{transform:translate(0px,0px);}

}

</style>

</head>

<body>

<h1>WebView2 GPU検証ツール</h1>

<section>

<h2>環境情報</h2>

<table>

<tr><td>WebGL</td><td id="webgl"></td></tr>
<tr><td>Renderer</td><td id="renderer"></td></tr>
<tr><td>Vendor</td><td id="vendor"></td></tr>
<tr><td>WebGPU</td><td id="webgpu"></td></tr>
<tr><td>FPS</td><td id="fps"></td></tr>
<tr><td>GPU判定</td><td id="judge"></td></tr>

</table>

</section>


<section>

<h2>Canvas2D負荷</h2>

<button onclick="canvasStart()">開始</button>
<button onclick="canvasStop()">停止</button>

<br><br>

<canvas id="canvas2d"
width="800"
height="250"></canvas>

</section>

<section>

<h2>WebGL負荷</h2>

<canvas id="glcanvas"
width="800"
height="250"></canvas>

</section>


<section>

<h2>CSS Animation</h2>

<div id="cssArea"></div>

</section>


<section>

<h2>CPU負荷</h2>

<button onclick="cpuTest()">CPU負荷実行</button>

<div id="cpuResult"></div>

</section>


<script>

/////////////////////////////////////////

document.getElementById("webgpu").innerHTML=
navigator.gpu ? "Available":"Not Available";

/////////////////////////////////////////

var gl=
document.getElementById("glcanvas")
.getContext("webgl");

if(gl){

document.getElementById("webgl").innerHTML="Available";

var ext=
gl.getExtension("WEBGL_debug_renderer_info");

if(ext){

var renderer=
gl.getParameter(ext.UNMASKED_RENDERER_WEBGL);

var vendor=
gl.getParameter(ext.UNMASKED_VENDOR_WEBGL);

document.getElementById("renderer").innerHTML=renderer;
document.getElementById("vendor").innerHTML=vendor;

if(renderer.indexOf("SwiftShader")>=0)
{
document.getElementById("judge").innerHTML=
"GPU無効（SwiftShader）";
}
else{

document.getElementById("judge").innerHTML=
"GPU利用中";

}

}

}
else{

document.getElementById("webgl").innerHTML="Not Available";

}

/////////////////////////////////////////

var last=performance.now();

var frame=0;

function fpsLoop(){

frame++;

var now=performance.now();

if(now-last>1000){

document.getElementById("fps").innerHTML=frame;

frame=0;

last=now;

}

requestAnimationFrame(fpsLoop);

}

fpsLoop();

/////////////////////////////////////////

var ctx=
document.getElementById("canvas2d").getContext("2d");

var timer;

function draw(){

ctx.clearRect(0,0,800,250);

for(var i=0;i<10000;i++){

ctx.fillStyle=
"rgb("
+(i%255)+",100,150)";

ctx.fillRect(

Math.random()*800,
Math.random()*250,
2,
2);

}

}

function canvasStart(){

timer=setInterval(draw,16);

}

function canvasStop(){

clearInterval(timer);

}

/////////////////////////////////////////

if(gl){

var angle=0;

function render(){

angle+=0.02;

gl.viewport(0,0,800,250);

gl.clearColor(
Math.abs(Math.sin(angle)),
0.2,
0.6,
1);

gl.clear(gl.COLOR_BUFFER_BIT);

requestAnimationFrame(render);

}

render();

}

/////////////////////////////////////////

var area=
document.getElementById("cssArea");

for(var i=0;i<500;i++){

var b=
document.createElement("div");

b.className="ball";

b.style.left=
Math.random()*760+"px";

b.style.top=
Math.random()*220+"px";

b.style.animationDelay=
(Math.random()*4)+"s";

area.appendChild(b);

}

/////////////////////////////////////////

function cpuTest(){

var start=
performance.now();

var x=0;

for(var i=0;i<100000000;i++){

x+=Math.sqrt(i);

}

var end=
performance.now();

document.getElementById("cpuResult").innerHTML=

"完了 "+(end-start).toFixed(1)+" ms";

}

/////////////////////////////////////////

</script>

</body>

</html>
